[package]
name = "enigma-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line Enigma M3/M4 encrypt/decrypt (clap + enigma-core)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "enigma"
path = "src/main.rs"

[dependencies]
enigma-core = { path = "../enigma-core" }
enigma-solver = { path = "../enigma-solver" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
