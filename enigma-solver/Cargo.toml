[package]
name = "enigma-solver"
version = "0.1.0"
edition = "2021"
description = "Enigma M3/M4 solvers: crib attack + blind quadgram hill-climb (rayon-parallel)"
license = "MIT OR Apache-2.0"

[dependencies]
enigma-core = { path = "../enigma-core" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "hotloop"
harness = false
