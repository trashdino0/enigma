[package]
name = "enigma-desktop"
version = "0.1.0"
edition = "2021"
description = "EnigmaSaurus desktop app: Tauri shell, vanilla HTML/CSS/JS frontend"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigma-core = { path = "../../enigma-core" }
enigma-config = { path = "../../enigma-config" }
enigma-solver = { path = "../../enigma-solver" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
